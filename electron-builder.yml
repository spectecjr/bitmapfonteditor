appId: com.spectecjr.fonteditor
productName: Font Editor
copyright: Copyright © Simon Cooke

# electron-builder auto-publishes straight to GitHub Releases whenever it sees
# a GH_TOKEN and a tag-shaped ref — true in CI even though .github/workflows/
# release.yml never asked for that, and never configured a `publish:` block
# here in the first place. Left implicit, that produced a second, differently
# name-sanitized copy of every artifact (spaces become hyphens here vs. dots
# from `gh release upload`) plus electron-updater's latest*.yml metadata,
# uploaded independently of and in addition to the workflow's own upload step
# — discovered the hard way on the v0.1.2 release. This workflow's own
# draft-then-publish sequencing is the only thing that should ever touch the
# release.
publish: never

directories:
  output: release
  # Not the default `build/`, which is too easy to mistake for build output and
  # gitignore by accident. assets/icon.png is picked up for all three platforms.
  buildResources: assets

# Everything the app needs is bundled into out/ by electron-vite, and every
# dependency is a devDependency, so node_modules never has to ship.
files:
  - out/**
  - package.json

# Unpacked next to app.asar rather than inside it (unlike `files` above), so
# it stays a normal folder on disk — Help ▸ Open Sample Fonts Folder points
# straight at it, and it's just as easy to browse to from File ▸ Open Font….
extraResources:
  - from: sample
    to: sample

win:
  target: nsis

mac:
  target: dmg
  category: public.app-category.graphics-design

linux:
  target: AppImage
  category: Graphics
