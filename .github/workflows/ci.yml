name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Nothing under test/ imports Electron, and neither the typecheck nor the
      # bundler needs the binary — only running the app does. Skipping the
      # ~100MB download keeps CI quick.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm test

      # Runs the typecheck first, then bundles main, preload and renderer.
      - run: npm run build
